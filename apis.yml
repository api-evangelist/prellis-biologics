aid: prellis-biologics
name: Prellis Biologics
description: 'Prellis Biologics is a Berkeley, California biotechnology company that
  discovers fully human antibody therapeutics by combining wet-lab human immunology
  with machine learning. Its EXIS (Externalized Immune System) platform uses LNO lymph
  node organoids — 3D tissue printed with holographic two-photon photolithography —
  to recreate human lymph node biology in vitro, raise true human antibody responses
  across genetically diverse donors, and feed the resulting sequence and characterization
  data into generative AI models that predict and optimize candidates in an iterative
  lab loop. The company sells antibody discovery collaborations and licensed therapeutic
  programs to pharmaceutical partners rather than software, and publishes no public
  developer program, API, SDK, or machine-readable specification.'
